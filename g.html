<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Личный кабинет</title>
</head>
<body class="bg-secondary">
<div class="container py-4">
<div class="card shadow">
<div class="card-header bg-primary text-white">
<h4 class="mb-0" id="header"></h4>
</div>
<div class="card-body">
<div id="info"></div>
<div id="list"></div>
</div>
</div>
</div>
<script>
document.getElementById("header").innerText=atob("0JLQsNGPINC/0L7QtNC/0LjRgdC60LA=");
let h=location.hash.substring(1);
if(h){
let d=decodeURIComponent(atob(h));
let l=d.split("\n");
let n="",d2="",s=[];
for(let i=0;i<l.length;i++){
if(l[i].startsWith("name=")) n=decodeURIComponent(l[i].slice(5));
else if(l[i].startsWith("desc=")) d2=decodeURIComponent(l[i].slice(5));
else if(l[i].startsWith("servers=")){
for(let j=i+1;j<l.length;j++){
let p=l[j].split("|");
if(p.length>=3) s.push({f:p[0],t:p[1],u:p[2]});
}
}
}
let o="";
if(n) o+="<h5>"+n+"</h5>";
if(d2) o+="<p class=\"text-muted\">"+d2+"</p><hr>";
let btn=atob("0J/QvtC00LrQu9GO0YfQuNGC0Yw=");
for(let i of s) o+="<div class=\"d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom\"><div><b>"+i.f+" "+i.t+"</b></div><div><a href=\"v2raytun://import/"+i.u+"\" class=\"btn btn-sm btn-success\">"+btn+"</a></div></div>";
document.getElementById("info").innerHTML=o;
}
</script>
</body>
</html>
